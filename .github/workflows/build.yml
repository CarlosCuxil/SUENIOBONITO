name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto.zip
        run: |
          if [ -f proyecto.zip ]; then
            rm -rf app
            unzip -q -o proyecto.zip
            echo "Proyecto descomprimido"
          else
            echo "No hay proyecto.zip, se usa la carpeta app del repo"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK (para instalar directo en tu cel)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Sueno.apk

      - name: Compilar AAB firmado (para Play Store)
        if: env.UPLOAD_KEYSTORE_B64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > app/upload.jks
          gradle :app:bundleRelease -PplaySign --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab Sueno-PlayStore.aab
          rm -f app/upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Sueno
          path: |
            Sueno.apk
            Sueno-PlayStore.aab
          if-no-files-found: warn

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Sueño v1.2.${{ github.run_number }}
          body: |
            Sueno.apk: descárgalo en tu Android e instálalo.
            Sueno-PlayStore.aab: el archivo que se sube a Google Play Console (solo aparece si configuraste la llave).
          files: |
            Sueno.apk
            Sueno-PlayStore.aab
          fail_on_unmatched_files: false
          make_latest: true
