<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sueño</title>
<style>
@font-face{font-family:Fraunces;src:url('fonts/Fraunces.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:Atkinson;src:url('fonts/Atkinson-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Atkinson;src:url('fonts/Atkinson-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  --ink:#171A33;--deep:#10122A;--surface:#21254A;--surface2:#2A2F5C;--line:#30355F;
  --paper:#ECE6D6;--mute:#9A97B8;--amber:#E6A85C;--teal:#78B3A6;--lav:#A89BE0;--rose:#D98C8C;
  --serif:Fraunces,Georgia,serif;--sans:Atkinson,system-ui,-apple-system,Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:15px/1.45 var(--sans);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}h2{font-size:21px;line-height:1.2}h3{font-size:16px}
p{margin:0}.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.ic{display:block;flex:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Vistas */
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;padding:calc(10px + var(--st)) 20px calc(110px + var(--sb))}
.view.on{display:block;animation:enter .32s var(--ease)}
.view.noanim{animation:none}
.view.full{padding-bottom:calc(30px + var(--sb))}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:4px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--paper)}
.iconbtn:active{background:var(--surface)}

/* Navegación */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:8px 6px calc(10px + var(--sb));background:rgba(14,16,48,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);transition:transform .3s var(--ease)}
#nav.hide{transform:translateY(110%)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
#nav .pill{width:56px;height:30px;border-radius:16px;display:grid;place-items:center;transition:background .25s,color .25s}
#nav button.on{color:var(--paper)}
#nav button.on .pill{background:var(--surface2)}

/* Componentes */
.card{background:var(--deep);border:1px solid var(--line);border-radius:24px;padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font-weight:700;padding:16px 20px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--paper);color:var(--ink);font-size:17px;padding:19px;width:100%}
.btn.soft{background:var(--surface);color:var(--paper)}
.btn.ghost{border:1px solid var(--line);color:var(--paper)}
.btn.danger{border:1px solid var(--rose);color:var(--rose)}
.btn[disabled]{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--mute);transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--lav);border-color:var(--lav);color:var(--ink)}
.chip.amb{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.chip.plain{color:var(--paper)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tile{flex:1;background:var(--surface);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .12s}
.tile:active{transform:scale(.96)}
.ibox{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.stat b{font-family:var(--serif);font-weight:500;font-size:19px;display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
.lst .it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lst .it:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--paper);top:3px;left:3px;transition:left .2s var(--ease)}
.sw.on{background:var(--amber)}.sw.on::after{left:21px}
.sec{margin-top:24px}.sec>h2,.sec>h3{margin-bottom:12px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px}
.seg button{flex:1;text-align:center;padding:8px 0;border-radius:999px;color:var(--mute);font-size:14px;transition:background .25s,color .25s}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:700}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--amber);color:var(--ink)}
.hint{display:flex;gap:10px;align-items:center;background:rgba(120,179,166,.12);border-radius:14px;padding:12px 14px;font-size:13px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:18px;color:var(--mute);text-align:center}
.grouplabel{color:var(--mute);font-size:13px;margin:22px 0 6px}

/* Cielo */
.sky{position:absolute;left:0;right:0;top:0;height:360px;background:radial-gradient(120% 90% at 80% 0%,#2C2A63 0%,#1B1D45 45%,rgba(23,26,51,0) 100%);pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.moon{position:absolute;right:26px;top:calc(48px + var(--st));animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 16px rgba(255,236,190,.25))}50%{filter:drop-shadow(0 0 30px rgba(255,236,190,.5))}}
.rel{position:relative;z-index:1}

/* Hoja inferior */
#scrim{position:fixed;inset:0;background:rgba(5,6,20,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--ink);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:10px 20px calc(24px + var(--sb));max-height:86%;overflow-y:auto;transform:translateY(105%);transition:transform .32s var(--ease)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
#sheet h2{margin-bottom:6px}

/* Rueda de hora */
.wheel{display:flex;justify-content:center;align-items:center;gap:6px;position:relative;height:168px;font-family:var(--serif);font-weight:300}
.wheel::before{content:"";position:absolute;left:0;right:0;top:56px;height:56px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none}
.wcol{height:168px;width:96px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wcol div{height:56px;display:grid;place-items:center;scroll-snap-align:center;font-size:30px;color:#4A4E80;transition:color .15s,font-size .15s}
.wcol div.sel{color:var(--paper);font-size:52px}
.wcol .pad{scroll-snap-align:none}
.wsep{font-size:44px;color:var(--paper)}

/* Grabación */
#v-recording{background:#000;color:#4E4A76;padding:0;overflow:hidden}
#rec-clock{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;transition:left 3s ease,top 3s ease;width:320px}
#rec-clock .t{font-family:var(--serif);font-weight:300;font-size:92px;color:#45416A;line-height:1}
#rec-wave{display:block;margin:28px auto 0;width:240px;height:40px}
.rec-top{position:absolute;top:calc(20px + var(--st));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px}
.recdot{width:8px;height:8px;border-radius:50%;background:#8A4E3E;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#hold{position:absolute;left:50%;bottom:calc(46px + var(--sb));transform:translateX(-50%);width:104px;height:104px;display:grid;place-items:center;color:#5A5590;touch-action:none}
#hold svg.r{position:absolute;inset:0}
#hold .lbl{font-size:11px;line-height:1.25;text-align:center}
.rec-note{position:absolute;bottom:calc(170px + var(--sb));left:30px;right:30px;text-align:center;color:#34314F;font-size:13px}
.rec-meta{display:flex;justify-content:center;gap:16px;color:#3E3A60;font-size:13px;margin-top:16px}
.rec-meta span{display:flex;align-items:center;gap:5px}

/* Alarma */
#v-alarm{padding:0;overflow:hidden;background:linear-gradient(180deg,#2A2F5C 0%,#5C4E7A 45%,#C98A5A 85%,#E6A85C 100%)}
.sun{position:absolute;left:50%;bottom:-130px;width:440px;height:440px;margin-left:-220px;border-radius:50%;background:radial-gradient(circle,#FFE2A8 0%,rgba(255,200,120,.5) 35%,rgba(255,180,100,0) 70%);animation:rise 4s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(20px) scale(.95)}to{transform:translateY(0) scale(1.05)}}
.slide{position:absolute;left:24px;right:24px;bottom:calc(150px + var(--sb));height:70px;border-radius:999px;background:rgba(23,26,51,.45);display:flex;align-items:center;padding:7px;touch-action:none}
.knob{width:56px;height:56px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;flex:none;position:relative;z-index:2;transition:transform .25s var(--ease)}
.slide .txt{position:absolute;left:70px;right:20px;text-align:center;font-weight:700;animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:1}}

/* Detalle */
.graphwrap{position:relative}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.cursor{position:absolute;top:4px;width:1px;background:var(--paper);opacity:0;pointer-events:none}
.cursor.on{opacity:.5}
.drawline{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fade .8s ease .9s forwards}
@keyframes fade{to{opacity:1}}
.phasebar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface)}
.phasebar i{display:block;height:100%;width:0;transition:width 1s var(--ease)}
.clip{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.clip:last-child{border-bottom:0}
.play{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.wf{position:relative;margin-top:5px;height:22px}
.wf .fill{position:absolute;inset:0;width:0;overflow:hidden}
.tipcard{display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px}

/* Estadísticas */
.bar{transform-origin:bottom;transform:scaleY(0);animation:grow .7s var(--ease) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.impact{padding:11px 0;border-bottom:1px solid var(--line)}
.impact .track{height:6px;border-radius:9px;background:var(--surface);margin-top:8px;position:relative}
.impact .track i{position:absolute;top:0;height:100%;border-radius:9px;width:0;transition:width .8s var(--ease)}
.impact .track b{position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--mute)}

/* Diario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#4E4A76;transition:transform .15s}
.day.has{color:var(--ink);font-weight:700}
.day.sel{outline:2px solid var(--paper);outline-offset:2px}
.day.today{box-shadow:inset 0 0 0 1px var(--mute)}
.day:active{transform:scale(.9)}

/* Relajarse */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sbtn{text-align:center}
.sbtn .sq{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;background:var(--surface);color:var(--paper);transition:background .2s,color .2s,transform .12s}
.sbtn.on .sq{background:var(--lav);color:var(--ink)}
.sbtn:active .sq{transform:scale(.94)}
.sbtn p{margin-top:6px;font-size:12px;color:var(--mute)}
.sbtn.on p{color:var(--paper)}
.sbtn.on .sq svg{animation:bob 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.85)}50%{transform:scale(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);border:0}
.bigplay{width:58px;height:58px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;margin:16px auto 0}

/* Respiración */
#v-breathe{background:radial-gradient(100% 70% at 50% 40%,#1E3040,#171A33 70%)}
.orb{position:relative;width:300px;height:300px;margin:44px auto 0}
.orb .halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(120,179,166,.35),rgba(120,179,166,.06) 60%,transparent 70%)}
.orb .ringo{position:absolute;inset:40px;border-radius:50%;border:1.5px solid rgba(120,179,166,.35)}
.orb .core{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9FD3C6,#5E9A8E);box-shadow:0 0 60px rgba(120,179,166,.5);transform:scale(.55);display:grid;place-items:center;color:#10122A;text-align:center;transition-property:transform;transition-timing-function:ease-in-out}
.orb .core .n{font-family:var(--serif);font-size:46px;line-height:1}
.orb .core .w{font-weight:700}

/* Inicio de la app */
#v-onboard{padding-bottom:calc(30px + var(--sb))}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--paper)}

#toast{position:fixed;left:50%;bottom:calc(110px + var(--sb));transform:translate(-50%,20px);background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:60;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.meter{height:12px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .1s}
.count{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="v-onboard"></section>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-prepare"></section>
  <section class="view" id="v-recording"></section>
  <section class="view" id="v-alarm"></section>
  <section class="view" id="v-mood"></section>
  <section class="view" id="v-detail"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-diary"></section>
  <section class="view" id="v-relax"></section>
  <section class="view" id="v-breathe"></section>
  <section class="view" id="v-settings"></section>
  <section class="view" id="v-report"></section>
</div>
<nav id="nav" class="hide"></nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script src="icons.js"></script>
<script src="analysis.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
</body>
</html>
